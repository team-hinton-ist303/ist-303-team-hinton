# Run the test suite on every pull request and on every push to main.
# Not a required check: a red X shows something broke, but it can't block a merge.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest -ra --cov=. --cov-report=term-missing
